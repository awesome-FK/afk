name: Generate Native Runners

on:
  workflow_dispatch:
  push:
    branches:
      - chore/native-platform-foundation
    paths:
      - .github/workflows/generate-native-runners.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-native-runners.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Generate official Android and iOS runners
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          flutter create --no-pub --platforms=android,ios --org com.example --project-name afk .
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/pubspec.lock" pubspec.lock
          test -f android/app/build.gradle
          test -f ios/Runner.xcodeproj/project.pbxproj
          git status --short
      - name: Upload generated native runners
        uses: actions/upload-artifact@v4
        with:
          name: flutter-3.50.0-native-runners
          path: |
            android/
            ios/
          if-no-files-found: error
          retention-days: 3
