name: One-time dependency lockfile

on:
  push:
    branches:
      - lock/phase1

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm -f .github/workflows/lockfile-once.yml tool/lock-trigger.txt
          if [ -f pubspec.lock ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A pubspec.lock .github/workflows/lockfile-once.yml tool/lock-trigger.txt
            git commit -m "chore: lock Flutter dependencies"
            git push
          else
            echo "pubspec.lock was not generated" >&2
            exit 1
          fi
