name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format --output=show lib/app/app_error_reporter.dart lib/app/bootstrap.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
